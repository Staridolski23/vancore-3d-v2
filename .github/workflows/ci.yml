name: Validate VANCORE
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ops/qa-runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --ignore-scripts --prefix ops/qa-runtime
      - run: node --test ops/supabase/*.test.cjs
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
